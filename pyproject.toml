[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zft"
version = "0.2.0a3"
description = "ZFT (Zero-Friction Traceability): contract-first verification and trace matrix gates for multi-agent work"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.20",
    "hypothesis>=6.100",
    "pytest>=8",
    "pytest-bdd>=8",
    "securesystemslib>=1.0",
    "ast-grep-py>=0.45",
    "cryptography>=50.0.1",
]

[project.optional-dependencies]
a2a = ["a2a-sdk>=0.3"]
dev = ["ruff>=0.6", "pre-commit>=3.7", "a2a-sdk>=0.3", "httpx", "mutmut==3.7"]

[project.scripts]
zft = "zft.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = [".zft", "oracle_*.py"]  # generated artifacts: gherkin renders, sandbox copies, evidence probes

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mutmut]
source_paths = ["src/zft/"]
pytest_add_cli_args_test_selection = ["tests"]
also_copy = [".zft", "pyproject.toml"]
